name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate paper index
        run: python3 scripts/generate-index.py

      - name: Package original papers and generated index
        run: |
          tar --create --file "$RUNNER_TEMP/artifact.tar" --dereference --hard-dereference \
            --exclude='.DS_Store' index.html paper assets

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
